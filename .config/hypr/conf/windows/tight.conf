
# -----------------------------------------------------
# General window layout and colors with no gap in the windows
# name: "No Gap"
# -----------------------------------------------------

general {
    gaps_in = 4
    gaps_out = 5
    border_size = 1
    col.active_border = $primary $on_primary 90deg
    col.inactive_border = $on_primary
    layout = dwindle
    resize_on_border = true
}

